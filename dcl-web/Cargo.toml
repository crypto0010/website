[package]
name = "dcl-web"
version = "0.1.0"
edition = "2021"

[dependencies]
dcl-core = { path = "../dcl-core" }
dcl-gpu = { path = "../dcl-gpu" }
dcl-crypto = { path = "../dcl-crypto" }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.5", features = ["cors"] }
